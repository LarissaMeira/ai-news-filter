<svg width="100%" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .th { font-size: 14px; font-weight: 500; fill: #3d3d3a; }
  .ts { font-size: 12px; font-weight: 400; fill: #73726c; }
  .title { font-size: 20px; font-weight: 500; fill: #3d3d3a; }
  .subtitle { font-size: 13px; font-weight: 400; fill: #73726c; }
  .arr { stroke: #73726c; stroke-width: 1.5; }
  @media (prefers-color-scheme: dark) {
    svg { background: #1a1a18; }
    .th, .title { fill: #c2c0b6; }
    .ts, .subtitle { fill: #9c9a92; }
    .arr { stroke: #9c9a92; }
    .teal-box { fill: #085041; stroke: #5DCAA5; }
    .teal-th { fill: #9FE1CB; }
    .teal-ts { fill: #5DCAA5; }
    .purple-box { fill: #3C3489; stroke: #AFA9EC; }
    .purple-th { fill: #CECBF6; }
    .purple-ts { fill: #AFA9EC; }
    .coral-box { fill: #712B13; stroke: #F0997B; }
    .coral-th { fill: #F5C4B3; }
    .coral-ts { fill: #F0997B; }
    .green-box { fill: #27500A; stroke: #97C459; }
    .green-th { fill: #C0DD97; }
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text class="title" x="340" y="36" text-anchor="middle">AI News Filter</text>
<text class="subtitle" x="340" y="56" text-anchor="middle">Less noise, more signal</text>

<text class="th" x="44" y="100">1. Your context</text>
<rect class="teal-box" x="44" y="114" width="180" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="teal-th th" x="134" y="134" text-anchor="middle" dominant-baseline="central" fill="#085041">📅 Calendar</text>
<text class="teal-ts ts" x="134" y="152" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Last 7 days</text>

<rect class="teal-box" x="244" y="114" width="180" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="teal-th th" x="334" y="134" text-anchor="middle" dominant-baseline="central" fill="#085041">📝 Notes</text>
<text class="teal-ts ts" x="334" y="152" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Last 7-14 days</text>

<rect class="teal-box" x="444" y="114" width="190" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="teal-th th" x="539" y="134" text-anchor="middle" dominant-baseline="central" fill="#085041">🧠 Memory</text>
<text class="teal-ts ts" x="539" y="152" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">General + last 7 days</text>

<line x1="340" y1="170" x2="340" y2="210" class="arr" marker-end="url(#arrow)"/>

<text class="th" x="44" y="230">2. Trusted sources</text>
<rect class="purple-box" x="44" y="244" width="140" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="purple-th th" x="114" y="264" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Labs</text>
<text class="purple-ts ts" x="114" y="282" text-anchor="middle" dominant-baseline="central" fill="#534AB7">OpenAI, Anthropic...</text>

<rect class="purple-box" x="200" y="244" width="140" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="purple-th th" x="270" y="264" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Apps</text>
<text class="purple-ts ts" x="270" y="282" text-anchor="middle" dominant-baseline="central" fill="#534AB7">Cursor, Lovable...</text>

<rect class="purple-box" x="356" y="244" width="140" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="purple-th th" x="426" y="264" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Funds</text>
<text class="purple-ts ts" x="426" y="282" text-anchor="middle" dominant-baseline="central" fill="#534AB7">a16z, YC, Sequoia...</text>

<rect class="purple-box" x="512" y="244" width="140" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="purple-th th" x="582" y="264" text-anchor="middle" dominant-baseline="central" fill="#3C3489">People</text>
<text class="purple-ts ts" x="582" y="282" text-anchor="middle" dominant-baseline="central" fill="#534AB7">Karpathy, Altman...</text>

<line x1="340" y1="300" x2="340" y2="340" class="arr" marker-end="url(#arrow)"/>

<text class="th" x="44" y="360">3. Relevance filter</text>
<rect class="coral-box" x="44" y="374" width="590" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="coral-th th" x="340" y="394" text-anchor="middle" dominant-baseline="central" fill="#712B13">~30 news in → 3-7 relevant out</text>
<text class="coral-ts ts" x="340" y="412" text-anchor="middle" dominant-baseline="central" fill="#993C1D">Crosses every item against your active projects, tools, and interests</text>

<line x1="340" y1="430" x2="340" y2="462" class="arr" marker-end="url(#arrow)"/>

<text class="th" x="44" y="482">4. Actionable digest</text>
<rect class="green-box" x="44" y="492" width="590" height="28" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text class="green-th th" x="340" y="506" text-anchor="middle" dominant-baseline="central" fill="#27500A">Why it matters for you + what you can test today</text>
</svg>
